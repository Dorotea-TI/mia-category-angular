<h5 mat-dialog-title class="mat-dialog-title">Organize</h5>
<button matButton (click)="onClickNewCategory()">+ Add new Category</button>

<mat-dialog-content>
  @if (!isLoading) {
    <div class="content" cdkDropList [cdkDropListData]="categories" (cdkDropListDropped)="drop($event, true)">
      @for (category of categories; track category.id) {
        <div class="example-container" cdkDrag>
          <button cdkDragHandle>+-</button>
          <h2>{{ category.title }}</h2>
          <div
            cdkDropList
            id="{{ 'drop-category-' + category.id }}"
            [cdkDropListData]="category.items"
            [cdkDropListConnectedTo]="dropListIds"
            (cdkDropListDropped)="drop($event, false)">
            @for (item of category.items; track item.id ?? item) {
              <div class="example-box" cdkDrag>
                <button cdkDragHandle>+</button>
                {{ item.title }}
              </div>
            }
          </div>
        </div>
      }
    </div>
  }
</mat-dialog-content>

<div class="mat-dialog-actions" mat-dialog-actions>
  @if (!isSending) {
    <button mat-stroked-button mat-dialog-close>Cancel</button>
    <button mat-raised-button color="primary" (click)="onClickSave()">Save</button>
  }
</div>
